
      - name: Configure Dependencies and Android
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Configure Flutter dependencies
          pub = Path("pubspec.yaml")
          text = pub.read_text(encoding="utf-8")

          text, count = re.subn(
              r"(?m)^([ \t]*file_picker:[ \t]*).+$",
              r"\g<1>^13.3.0",
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit("file_picker not found")

          if not re.search(r"(?m)^[ \t]*mobile_scanner[ \t]*:", text):
              text, count = re.subn(
                  r"(?m)^([ \t]*file_picker:[ \t]*.*)$",
                  r"\1\n  mobile_scanner: ^7.4.3",
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit("Could not add mobile_scanner")

          pub.write_text(text, encoding="utf-8")

          # Migrate file_picker API
          for dart_file in Path("lib").rglob("*.dart"):
              source = dart_file.read_text(encoding="utf-8")

              source = source.replace(
                  "FilePicker.platform.pickFiles(",
                  "FilePicker.pickFiles(",
              )

              source = source.replace(
                  "FilePicker.platform.saveFile(",
                  "FilePicker.saveFile(",
              )

              source = re.sub(
                  r"(?m)^[ \t]*withData:[ \t]*true,[ \t]*\n",
                  "",
                  source,
              )

              source = source.replace(
                  "if (result == null || result.files.isEmpty) return;",
                  "if (result.isEmpty) return;",
              )

              source = source.replace(
                  "final file = result.files.first;",
                  "final file = result.first;",
              )

              source = source.replace(
                  "final bytes = file.bytes ?? (file.path != null ? await File(file.path!).readAsBytes() : null);",
                  "final bytes = await file.readAsBytes();",
              )

              source = source.replace(
                  "        type: FileType.custom,\n        allowedExtensions: ['json'],\n        bytes:",
                  "        bytes:",
              )

              if not re.search(r"\bFile\s*\(", source):
                  source = re.sub(
                      r"(?m)^import 'dart:io';[ \t]*\n",
                      "",
                      source,
                  )

              dart_file.write_text(source, encoding="utf-8")

          # Configure Android Gradle
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              source = path.read_text(encoding="utf-8")

              for key, value in [
                  ("compileSdk", "37"),
                  ("minSdk", "26"),
              ]:
                  pattern = rf"(?m)^([ \t]*{key}[ \t]*=[ \t]*).+$"

                  source, count = re.subn(
                      pattern,
                      lambda m: m.group(1) + value,
                      source,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit(f"Cannot configure {key}")

              source = re.sub(
                  r"(?m)^([ \t]*sourceCompatibility[ \t]*=[ \t]*)JavaVersion\.\w+.*$",
                  r"\g<1>JavaVersion.VERSION_17",
                  source,
              )

              source = re.sub(
                  r"(?m)^([ \t]*targetCompatibility[ \t]*=[ \t]*)JavaVersion\.\w+.*$",
                  r"\g<1>JavaVersion.VERSION_17",
                  source,
              )

              # IMPORTANT: Correct Kotlin JVM target
              source, count = re.subn(
                  r"(?m)^([ \t]*jvmTarget[ \t]*=[ \t]*).+$",
                  r"\g<1>org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17",
                  source,
                  count=1,
              )

              if count != 1:
                  raise SystemExit("Could not configure Kotlin JVM target")

          elif groovy.exists():
              path = groovy
              source = path.read_text(encoding="utf-8")

              for key, value in [
                  ("compileSdkVersion", "37"),
                  ("minSdkVersion", "26"),
              ]:
                  if re.search(rf"(?m)^[ \t]*{key}[ \t]+", source):
                      pattern = rf"(?m)^([ \t]*{key}[ \t]+).+$"
                  else:
                      key = "compileSdk" if key == "compileSdkVersion" else "minSdk"
                      pattern = rf"(?m)^([ \t]*{key}[ \t]+).+$"

                  source, count = re.subn(
                      pattern,
                      lambda m: m.group(1) + value,
                      source,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit(f"Cannot configure {key}")

          else:
              raise SystemExit("Android Gradle file not found")

          path.write_text(source, encoding="utf-8")

          # AGP 9 compatibility
          props = Path("android/gradle.properties")
          props.parent.mkdir(parents=True, exist_ok=True)

          gp = props.read_text(encoding="utf-8") if props.exists() else ""

          for key, value in {
              "android.builtInKotlin": "false",
              "android.newDsl": "false",
          }.items():

              pattern = rf"(?m)^[ \t]*{re.escape(key)}=.*$"

              if re.search(pattern, gp):
                  gp = re.sub(
                      pattern,
                      f"{key}={value}",
                      gp,
                      count=1,
                  )
              else:
                  gp = gp.rstrip() + f"\n{key}={value}\n"

          props.write_text(gp, encoding="utf-8")

          # Android Manifest
          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              m = manifest.read_text(encoding="utf-8")

              m = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="TUN VPNSOPR"',
                  m,
                  count=1,
              )

              if "android.permission.CAMERA" not in m:
                  match = re.search(r"<manifest\b[^>]*>", m)

                  if not match:
                      raise SystemExit("Manifest tag not found")

                  m = (
                      m[:match.end()]
                      + '\n    <uses-permission android:name="android.permission.CAMERA" />'
                      + m[match.end():]
                  )

              manifest.write_text(m, encoding="utf-8")

          print("Dependencies configured")
          print("Kotlin JVM target: JVM_17")
          print("Android SDK: 37")
          print("Minimum SDK: 26")
          print("AGP 9 compatibility enabled")
          print("Configuration completed successfully")
          PY
          
