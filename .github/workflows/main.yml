
name: Build VPNSOPR Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VPNSOPR APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          unzip -oq "$ZIP" -d .

      - name: Fix file_picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          s, n = re.subn(
              r'(?m)^([ \t]*file_picker[ \t]*:[ \t]*).*$',
              r'\1^13.3.0',
              s,
              count=1
          )

          if n != 1:
              raise SystemExit("file_picker dependency not found")

          p.write_text(s)
          PY

      - name: Validate source
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f scripts/patch_android.py
          test -f assets/vpnsopr_icon.png

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37'
          accept-android-sdk-licenses: true

      - name: Verify Android SDK
        run: |
          command -v sdkmanager
          sdkmanager --list_installed

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --org com.vpnsopr --project-name vpnsopr --no-pub .
          fi

      - name: Configure Android
        run: python3 scripts/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
          
