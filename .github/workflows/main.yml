
name: Build VPNSOPR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VPNSOPR Android
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/VPNSOPR-Android-Source.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/vpnsopr-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/vpnsopr-source"

          PROJECT=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/lib/main.dart" ]; then
              PROJECT="$dir"
              break
            fi
          done < <(find "$RUNNER_TEMP/vpnsopr-source" -name pubspec.yaml -type f)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android project
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.vpnsopr \
              --project-name vpnsopr \
              --no-pub .
          fi

          if [ -f scripts/patch_android.py ]; then
            python3 scripts/patch_android.py
          elif [ -f patch_android.py ]; then
            python3 patch_android.py
          else
            echo "ERROR: patch_android.py not found"
            exit 1
          fi

      - name: Fix Android desugaring
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          p = next((x for x in files if x.exists()), None)

          if p is None:
              raise SystemExit("Android Gradle file not found")

          s = p.read_text(encoding="utf-8")

          if p.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled" not in s:
                  s, n = re.subn(
                      r"(compileOptions\s*\{)",
                      r"\1\n        isCoreLibraryDesugaringEnabled = true",
                      s, count=1
                  )
                  if n != 1:
                      raise SystemExit("Cannot enable desugaring")

              if "desugar_jdk_libs" not in s:
                  s, n = re.subn(
                      r"(?m)^dependencies\s*\{",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                      s, count=1
                  )
                  if n != 1:
                      raise SystemExit("Cannot add desugaring dependency")
          else:
              if "coreLibraryDesugaringEnabled" not in s:
                  s, n = re.subn(
                      r"(compileOptions\s*\{)",
                      r"\1\n        coreLibraryDesugaringEnabled true",
                      s, count=1
                  )
                  if n != 1:
                      raise SystemExit("Cannot enable desugaring")

              if "desugar_jdk_libs" not in s:
                  s, n = re.subn(
                      r"(?m)^dependencies\s*\{",
                      "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'",
                      s, count=1
                  )
                  if n != 1:
                      raise SystemExit("Cannot add desugaring dependency")

          p.write_text(s, encoding="utf-8")
          print("Desugaring configured successfully")
          PY

      - name: Install Flutter dependencies
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get

      - name: Analyze Dart source
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          flutter analyze --no-pub

      - name: Build release APKs
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-APKs
          path: ${{ steps.source.outputs.project_dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
          
