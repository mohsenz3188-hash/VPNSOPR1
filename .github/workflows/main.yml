
name: Build VPNSOPR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VPNSOPR Android
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/VPNSOPR-Android-Source.zip"

          test -f "$ZIP"

          mkdir -p "$RUNNER_TEMP/vpnsopr"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/vpnsopr"

          PROJECT=""

          while IFS= read -r f; do
            D="$(dirname "$f")"
            if [ -f "$D/lib/main.dart" ]; then
              PROJECT="$D"
              break
            fi
          done < <(find "$RUNNER_TEMP/vpnsopr" -name pubspec.yaml)

          if [ -z "$PROJECT" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Prepare Android Project
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.vpnsopr \
              --project-name vpnsopr \
              --no-pub .
          fi

      - name: Fix Dependencies and Android SDK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          pub = Path("pubspec.yaml")
          s = pub.read_text(encoding="utf-8")

          s, n = re.subn(
              r'(?m)^(\s*file_picker:\s*).+$',
              r'\g<1>^11.0.2',
              s,
              count=1
          )

          if n != 1:
              raise SystemExit("file_picker dependency not found")

          pub.write_text(s, encoding="utf-8")

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              p = kts
              s = p.read_text(encoding="utf-8")

              for key, value in [
                  ("compileSdk", "36"),
                  ("minSdk", "26")
              ]:
                  pattern = rf'(?m)^(\s*{key}\s*=\s*).+$'
                  s, n = re.subn(
                      pattern,
                      lambda m: m.group(1) + value,
                      s,
                      count=1
                  )
                  if n != 1:
                      raise SystemExit(f"Cannot set {key}")

              s = re.sub(
                  r'(?m)^(\s*sourceCompatibility\s*=\s*)JavaVersion\.\w+.*$',
                  r'\g<1>JavaVersion.VERSION_17',
                  s
              )

              s = re.sub(
                  r'(?m)^(\s*targetCompatibility\s*=\s*)JavaVersion\.\w+.*$',
                  r'\g<1>JavaVersion.VERSION_17',
                  s
              )

              if "isCoreLibraryDesugaringEnabled" not in s:
                  s, n = re.subn(
                      r'(compileOptions\s*\{)',
                      r'\1\n        isCoreLibraryDesugaringEnabled = true',
                      s,
                      count=1
                  )
                  if n != 1:
                      raise SystemExit("Cannot enable desugaring")

              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'

              if "desugar_jdk_libs" not in s:
                  if re.search(r'(?m)^\s*dependencies\s*\{', s):
                      s = re.sub(
                          r'(?m)^(\s*dependencies\s*\{)',
                          lambda m: m.group(1) + '\n    ' + dep,
                          s,
                          count=1
                      )
                  else:
                      s += '\ndependencies {\n    ' + dep + '\n}\n'

          elif groovy.exists():
              p = groovy
              s = p.read_text(encoding="utf-8")

              for key, value in [
                  ("compileSdkVersion", "36"),
                  ("minSdkVersion", "26")
              ]:
                  pattern = rf'(?m)^(\s*{key}\s+).+$'
                  s, n = re.subn(
                      pattern,
                      lambda m: m.group(1) + value,
                      s,
                      count=1
                  )
                  if n != 1:
                      raise SystemExit(f"Cannot set {key}")

              if "coreLibraryDesugaringEnabled" not in s:
                  s, n = re.subn(
                      r'(compileOptions\s*\{)',
                      r'\1\n        coreLibraryDesugaringEnabled true',
                      s,
                      count=1
                  )
                  if n != 1:
                      raise SystemExit("Cannot enable desugaring")

              if "desugar_jdk_libs" not in s:
                  dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
                  if re.search(r'(?m)^\s*dependencies\s*\{', s):
                      s = re.sub(
                          r'(?m)^(\s*dependencies\s*\{)',
                          lambda m: m.group(1) + '\n    ' + dep,
                          s,
                          count=1
                      )
                  else:
                      s += '\ndependencies {\n    ' + dep + '\n}\n'

          else:
              raise SystemExit("Android Gradle file not found")

          p.write_text(s, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              m = manifest.read_text(encoding="utf-8")

              m = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="TUN VPNSOPR"',
                  m,
                  count=1
              )

              if "android.permission.CAMERA" not in m:
                  match = re.search(r"<manifest\b[^>]*>", m)
                  if match:
                      m = (
                          m[:match.end()]
                          + '\n    <uses-permission android:name="android.permission.CAMERA" />'
                          + m[match.end():]
                      )

              manifest.write_text(m, encoding="utf-8")

          print("Android SDK 36 configured")
          print("Java 17 configured")
          print("Desugaring configured")
          print("FilePicker compatibility configured")
          PY

      - name: Clean and Resolve
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-APKs
          path: ${{ steps.source.outputs.project }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
          
