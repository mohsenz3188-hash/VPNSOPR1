name: Build VPNSOPR Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpnsopr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VPNSOPR Android
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          ZIP="$WORK/VPNSOPR-Android-Source.zip"

          if [ -f "$ZIP" ]; then
            rm -rf "$WORK/_source"
            mkdir -p "$WORK/_source"

            unzip -q "$ZIP" -d "$WORK/_source"

            while IFS= read -r -d '' file; do
              dir="$(dirname "$file")"

              if [ -f "$dir/lib/main.dart" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            done < <(find "$WORK/_source" -type f -name pubspec.yaml -print0)

            if [ -z "$PROJECT_DIR" ]; then
              PUBSPEC="$(find "$WORK/_source" -type f -name pubspec.yaml -print -quit || true)"
              if [ -n "$PUBSPEC" ]; then
                PROJECT_DIR="$(dirname "$PUBSPEC")"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ] && [ -f "$WORK/pubspec.yaml" ]; then
            PROJECT_DIR="$WORK"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project located: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android project if missing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.vpnsopr \
              .
          fi

      - name: Fix dependencies and Android configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec = Path("pubspec.yaml")

          if not pubspec.exists():
              raise SystemExit("pubspec.yaml not found")

          content = pubspec.read_text(encoding="utf-8")

          pattern = r"(?m)^([ \t]*file_picker[ \t]*:[ \t]*)[^\r\n#]+"

          content, count = re.subn(
              pattern,
              r"\g<1>^13.3.0",
              content,
              count=1
          )

          if count == 0:
              dependency = re.search(
                  r"(?m)^dependencies:\s*$",
                  content
              )

              if dependency is None:
                  raise SystemExit("dependencies section not found")

              position = dependency.end()

              content = (
                  content[:position]
                  + "\n  file_picker: ^13.3.0"
                  + content[position:]
              )

          pubspec.write_text(content, encoding="utf-8")

          print("file_picker set to ^13.3.0")

          app = Path("android/app")

          gradle = app / "build.gradle"
          kotlin_gradle = app / "build.gradle.kts"

          if gradle.exists():
              path = gradle
              kts = False
          elif kotlin_gradle.exists():
              path = kotlin_gradle
              kts = True
          else:
              raise SystemExit("Android app Gradle file not found")

          text = path.read_text(encoding="utf-8")

          if kts:
              text = re.sub(
                  r"(?m)^(\s*compileSdk\s*=\s*).+$",
                  r"\g<1>36",
                  text
              )

              text = re.sub(
                  r"(?m)^(\s*minSdk\s*=\s*).+$",
                  r"\g<1>26",
                  text
              )

              text = re.sub(
                  r"(?m)^(\s*sourceCompatibility\s*=\s*).+$",
                  r"\g<1>JavaVersion.VERSION_17",
                  text
              )

              text = re.sub(
                  r"(?m)^(\s*targetCompatibility\s*=\s*).+$",
                  r"\g<1>JavaVersion.VERSION_17",
                  text
              )

              if "isCoreLibraryDesugaringEnabled" not in text:
                  match = re.search(
                      r"(?m)^(\s*compileOptions\s*\{)",
                      text
                  )

                  if match:
                      pos = match.end()
                      text = (
                          text[:pos]
                          + "\n        isCoreLibraryDesugaringEnabled = true"
                          + text[pos:]
                      )
                  else:
                      raise SystemExit("compileOptions block not found")

              if "desugar_jdk_libs" not in text:
                  match = re.search(
                      r"(?m)^(\s*dependencies\s*\{)",
                      text
                  )

                  if match:
                      pos = match.end()
                      text = (
                          text[:pos]
                          + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
                          + text[pos:]
                      )
                  else:
                      text += (
                          '\ndependencies {\n'
                          '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n'
                          '}\n'
                      )

          else:
              text = re.sub(
                  r"(?m)^(\s*compileSdkVersion\s+).+$",
                  r"\g<1>36",
                  text
              )

              text = re.sub(
                  r"(?m)^(\s*compileSdk\s+).+$",
                  r"\g<1>36",
                  text
              )

              text = re.sub(
                  r"(?m)^(\s*minSdkVersion\s+).+$",
                  r"\g<1>26",
                  text
              )

              text = re.sub(
                  r"(?m)^(\s*minSdk\s+).+$",
                  r"\g<1>26",
                  text
              )

              text = re.sub(
                  r"(?m)^(\s*sourceCompatibility\s+).+$",
                  r"\g<1>JavaVersion.VERSION_17",
                  text
              )

              text = re.sub(
                  r"(?m)^(\s*targetCompatibility\s+).+$",
                  r"\g<1>JavaVersion.VERSION_17",
                  text
              )

              if "coreLibraryDesugaringEnabled" not in text:
                  match = re.search(
                      r"(?m)^(\s*compileOptions\s*\{)",
                      text
                  )

                  if match:
                      pos = match.end()
                      text = (
                          text[:pos]
                          + "\n        coreLibraryDesugaringEnabled true"
                          + text[pos:]
                      )
                  else:
                      raise SystemExit("compileOptions block not found")

              if "desugar_jdk_libs" not in text:
                  match = re.search(
                      r"(?m)^(\s*dependencies\s*\{)",
                      text
                  )

                  if match:
                      pos = match.end()
                      text = (
                          text[:pos]
                          + "\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
                          + text[pos:]
                      )
                  else:
                      text += (
                          "\ndependencies {\n"
                          "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n"
                          "}\n"
                      )

          path.write_text(text, encoding="utf-8")

          print("Android Gradle configuration updated")
          print("Compile SDK: 36")
          print("Minimum SDK: 26")
          print("Java: 17")
          print("Core library desugaring enabled")
          PY

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Resolve Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
