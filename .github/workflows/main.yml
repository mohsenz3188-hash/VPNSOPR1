
      - name: Fix FilePicker API
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_servers():
              p = Path("lib/screens/servers_screen.dart")
              if not p.exists():
                  raise SystemExit("servers_screen.dart not found")

              s = p.read_text(encoding="utf-8")

              pattern = (
                  r"^([ \t]*)final result = await "
                  r"FilePicker\.platform\.pickFiles\(.*?"
                  r"^\1final content = utf8\.decode"
                  r"\(bytes, allowMalformed: false\);"
              )

              def replace(m):
                  i = m.group(1)
                  return (
                      f"{i}final file = await FilePicker.pickFile(\n"
                      f"{i}  type: FileType.custom,\n"
                      f"{i}  allowedExtensions: "
                      "['conf', 'json', 'yaml', 'yml', 'txt'],\n"
                      f"{i});\n"
                      f"{i}if (file == null) return;\n"
                      f"{i}final bytes = await file.readAsBytes();\n"
                      f"{i}final content = utf8.decode("
                      "bytes, allowMalformed: false);"
                  )

              if "FilePicker.platform" in s:
                  s, n = re.subn(
                      pattern, replace, s,
                      count=1, flags=re.MULTILINE | re.DOTALL
                  )
                  if n != 1:
                      raise SystemExit("Could not patch servers_screen.dart")

              s = s.replace("import 'dart:io';\n", "")

              if "FilePicker.platform" in s:
                  raise SystemExit("Old FilePicker API remains in servers")

              p.write_text(s, encoding="utf-8")
              print("Servers screen fixed")

          def patch_settings():
              p = Path("lib/screens/settings_screen.dart")
              if not p.exists():
                  raise SystemExit("settings_screen.dart not found")

              s = p.read_text(encoding="utf-8")

              export_pattern = (
                  r"^([ \t]*)final path = await "
                  r"FilePicker\.platform\.saveFile\(.*?^\1\);"
              )

              def replace_export(m):
                  i = m.group(1)
                  return (
                      f"{i}final savedUri = await FilePicker.saveFile(\n"
                      f"{i}  dialogTitle: 'ذخیره پشتیبان VPNSOPR',\n"
                      f"{i}  fileName: 'vpnsopr-backup.json',\n"
                      f"{i}  bytes: Uint8List.fromList(utf8.encode(backup)),\n"
                      f"{i}  mimeType: 'application/json',\n"
                      f"{i});"
                  )

              if "FilePicker.platform.saveFile" in s:
                  s, n = re.subn(
                      export_pattern, replace_export, s,
                      count=1, flags=re.MULTILINE | re.DOTALL
                  )
                  if n != 1:
                      raise SystemExit("Could not patch backup export")

              s = s.replace(
                  "if (context.mounted && path != null)",
                  "if (context.mounted && savedUri != null)"
              )

              restore_pattern = (
                  r"^([ \t]*)final result = await "
                  r"FilePicker\.platform\.pickFiles\(.*?"
                  r"^\1final count = await controller\.restoreBackup"
                  r"\(utf8\.decode\(bytes\)\);"
              )

              def replace_restore(m):
                  i = m.group(1)
                  return (
                      f"{i}final file = await FilePicker.pickFile(\n"
                      f"{i}  type: FileType.custom,\n"
                      f"{i}  allowedExtensions: ['json'],\n"
                      f"{i});\n"
                      f"{i}if (file == null) return;\n"
                      f"{i}final bytes = await file.readAsBytes();\n"
                      f"{i}final count = await controller.restoreBackup("
                      "utf8.decode(bytes));"
                  )

              if "FilePicker.platform.pickFiles" in s:
                  s, n = re.subn(
                      restore_pattern, replace_restore, s,
                      count=1, flags=re.MULTILINE | re.DOTALL
                  )
                  if n != 1:
                      raise SystemExit("Could not patch backup restore")

              s = s.replace("import 'dart:io';\n", "")

              if "FilePicker.platform" in s:
                  raise SystemExit("Old FilePicker API remains in settings")

              p.write_text(s, encoding="utf-8")
              print("Settings screen fixed")

          patch_servers()
          patch_settings()

          print("FilePicker migration completed successfully")
          PY
