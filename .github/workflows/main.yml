
name: Build VPNSOPR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VPNSOPR Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/VPNSOPR-Android-Source.zip"

          test -f "$ZIP" || {
            echo "Source ZIP not found"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/vpnsopr"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/vpnsopr"

          PROJECT=""

          while IFS= read -r f; do
            D="$(dirname "$f")"
            if [ -f "$D/lib/main.dart" ]; then
              PROJECT="$D"
              break
            fi
          done < <(find "$RUNNER_TEMP/vpnsopr" -name pubspec.yaml)

          if [ -z "$PROJECT" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"

          PLATFORM_DIR="$SDK_ROOT/platforms"

          test -d "$PLATFORM_DIR/android-37.0"

          if [ -e "$PLATFORM_DIR/android-37" ] && \
             [ ! -L "$PLATFORM_DIR/android-37" ]; then
            rm -rf "$PLATFORM_DIR/android-37"
          fi

          ln -sfn android-37.0 "$PLATFORM_DIR/android-37"

          test -d "$PLATFORM_DIR/android-37"

          echo "Android SDK 37 installed"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Prepare Android Project
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.vpnsopr \
              --project-name vpnsopr \
              --no-pub .
          fi

          test -f android/app/build.gradle.kts || \
          test -f android/app/build.gradle

      - name: Configure Dependencies and Android
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Configure file_picker
          pub = Path("pubspec.yaml")
          text = pub.read_text(encoding="utf-8")

          text, count = re.subn(
              r"(?m)^([ \t]*file_picker:[ \t]*).+$",
              r"\g<1>^13.3.0",
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit("file_picker dependency not found")

          # Add QR scanner dependency
          if not re.search(r"(?m)^[ \t]*mobile_scanner[ \t]*:", text):
              text, count = re.subn(
                  r"(?m)^([ \t]*file_picker:[ \t]*.*)$",
                  r"\1\n  mobile_scanner: ^7.4.3",
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit("Could not add mobile_scanner")

          pub.write_text(text, encoding="utf-8")

          # Migrate file_picker API to version 13
          for dart_file in Path("lib").rglob("*.dart"):

              source = dart_file.read_text(encoding="utf-8")

              source = source.replace(
                  "FilePicker.platform.pickFiles(",
                  "FilePicker.pickFiles(",
              )

              source = source.replace(
                  "FilePicker.platform.saveFile(",
                  "FilePicker.saveFile(",
              )

              source = re.sub(
                  r"(?m)^[ \t]*withData:[ \t]*true,[ \t]*\n",
                  "",
                  source,
              )

              source = source.replace(
                  "if (result == null || result.files.isEmpty) return;",
                  "if (result.isEmpty) return;",
              )

              source = source.replace(
                  "final file = result.files.first;",
                  "final file = result.first;",
              )

              source = source.replace(
                  "final bytes = file.bytes ?? (file.path != null ? await File(file.path!).readAsBytes() : null);",
                  "final bytes = await file.readAsBytes();",
              )

              source = source.replace(
                  "        type: FileType.custom,\n        allowedExtensions: ['json'],\n        bytes:",
                  "        bytes:",
              )

              if not re.search(r"\bFile\s*\(", source):
                  source = re.sub(
                      r"(?m)^import 'dart:io';[ \t]*\n",
                      "",
                      source,
                  )

              dart_file.write_text(source, encoding="utf-8")

          # Configure Android Gradle
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():

              path = kts
              source = path.read_text(encoding="utf-8")

              for key, value in [
                  ("compileSdk", "37"),
                  ("minSdk", "26"),
              ]:

                  pattern = rf"(?m)^([ \t]*{key}[ \t]*=[ \t]*).+$"

                  source, count = re.subn(
                      pattern,
                      lambda m: m.group(1) + value,
                      source,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit(f"Could not configure {key}")

              source = re.sub(
                  r"(?m)^([ \t]*sourceCompatibility[ \t]*=[ \t]*)JavaVersion\.\w+.*$",
                  r"\g<1>JavaVersion.VERSION_17",
                  source,
              )

              source = re.sub(
                  r"(?m)^([ \t]*targetCompatibility[ \t]*=[ \t]*)JavaVersion\.\w+.*$",
                  r"\g<1>JavaVersion.VERSION_17",
                  source,
              )

              source = re.sub(
                  r'(?m)^([ \t]*jvmTarget[ \t]*=[ \t]*).+$',
                  r'\g<1>"17"',
                  source,
              )

          elif groovy.exists():

              path = groovy
              source = path.read_text(encoding="utf-8")

              for key, value in [
                  ("compileSdkVersion", "37"),
                  ("minSdkVersion", "26"),
              ]:

                  if re.search(rf"(?m)^[ \t]*{key}[ \t]+", source):
                      pattern = rf"(?m)^([ \t]*{key}[ \t]+).+$"
                  else:
                      key = "compileSdk" if key == "compileSdkVersion" else "minSdk"
                      pattern = rf"(?m)^([ \t]*{key}[ \t]+).+$"

                  source, count = re.subn(
                      pattern,
                      lambda m: m.group(1) + value,
                      source,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit(f"Could not configure {key}")

              source = re.sub(
                  r"(?m)^([ \t]*sourceCompatibility[ \t]+)JavaVersion\.\w+.*$",
                  r"\g<1>JavaVersion.VERSION_17",
                  source,
              )

              source = re.sub(
                  r"(?m)^([ \t]*targetCompatibility[ \t]+)JavaVersion\.\w+.*$",
                  r"\g<1>JavaVersion.VERSION_17",
                  source,
              )

              source = re.sub(
                  r'(?m)^([ \t]*jvmTarget[ \t]*=[ \t]*).+$',
                  r'\g<1>"17"',
                  source,
              )

          else:
              raise SystemExit("Android Gradle file not found")

          path.write_text(source, encoding="utf-8")

          # Flutter 3.44 compatibility with legacy Kotlin mode
          gradle_properties = Path("android/gradle.properties")

          if gradle_properties.exists():

              gp = gradle_properties.read_text(encoding="utf-8")

              if "android.builtInKotlin=" not in gp:

                  gradle_properties.write_text(
                      gp.rstrip() + "\nandroid.builtInKotlin=false\n",
                      encoding="utf-8",
                  )

          # Android manifest
          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():

              m = manifest.read_text(encoding="utf-8")

              m = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="TUN VPNSOPR"',
                  m,
                  count=1,
              )

              if "android.permission.CAMERA" not in m:

                  match = re.search(r"<manifest\b[^>]*>", m)

                  if not match:
                      raise SystemExit("Manifest tag not found")

                  m = (
                      m[:match.end()]
                      + '\n    <uses-permission android:name="android.permission.CAMERA" />'
                      + m[match.end():]
                  )

              manifest.write_text(m, encoding="utf-8")

          print("file_picker configured")
          print("mobile_scanner configured")
          print("Android SDK 37 configured")
          print("Java 17 configured")
          print("Android configuration completed")
          PY

      - name: Clean and Resolve
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

      - name: Download Official SingBox AAR
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="$(python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          config = json.loads(
              Path(".dart_tool/package_config.json").read_text(encoding="utf-8")
          )

          package = next(
              item for item in config["packages"]
              if item["name"] == "flutter_sing_box"
          )

          uri = urlparse(package["rootUri"])

          if uri.scheme != "file":
              raise SystemExit("Invalid package URI")

          print(unquote(uri.path))
          PY
          )"

          GRADLE="$PLUGIN_DIR/android/build.gradle.kts"
          LIBDIR="$PLUGIN_DIR/android/libs"
          AAR="$LIBDIR/libbox.aar"

          test -f "$GRADLE"

          mkdir -p "$LIBDIR"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 30 \
            "https://github.com/singbox-android/libbox/releases/download/1.14.3/libbox.aar" \
            -o "$AAR"

          test -s "$AAR"
          unzip -tq "$AAR"

          python3 - "$GRADLE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          old = 'implementation("com.github.singbox-android:libbox:1.14.3")'
          new = 'implementation(files("libs/libbox.aar"))'

          if old in source:
              source = source.replace(old, new, 1)

          elif new not in source:
              raise SystemExit("libbox dependency not found")

          path.write_text(source, encoding="utf-8")

          print("Local libbox configured")
          PY

      - name: Verify Native Dependency
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="$(python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          config = json.loads(
              Path(".dart_tool/package_config.json").read_text(encoding="utf-8")
          )

          package = next(
              item for item in config["packages"]
              if item["name"] == "flutter_sing_box"
          )

          uri = urlparse(package["rootUri"])
          print(unquote(uri.path))
          PY
          )"

          test -s "$PLUGIN_DIR/android/libs/libbox.aar"

          grep -q 'libbox.aar' \
            "$PLUGIN_DIR/android/build.gradle.kts"

          echo "Native dependency verified"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -d "$SDK_ROOT/platforms/android-37"
          test -d "$SDK_ROOT/build-tools/37.0.0"

          echo "Android SDK verified"

      - name: Build Release APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-ARM64
          path: ${{ steps.source.outputs.project }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
