
name: Build VPNSOPR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vpnsopr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate the exact source archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="VPNSOPR-Android-Source.zip"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Upload VPNSOPR-Android-Source.zip to the repository root."
            exit 1
          fi

          unzip -oq "$ARCHIVE" -d .

          required_files=(
            "pubspec.yaml"
            "lib/main.dart"
            "lib/app.dart"
            "lib/theme.dart"
            "lib/core/vpn_controller.dart"
            "lib/screens/servers_screen.dart"
            "lib/screens/settings_screen.dart"
            "assets/vpnsopr_icon.png"
            "scripts/patch_android.py"
            "test/widget_test.dart"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required project file: $file"
              exit 1
            fi
          done

          echo "VPNSOPR source archive extracted and validated."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Check Flutter toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android project if missing
        shell: bash
        run: |
          if [[ ! -f android/app/build.gradle.kts && ! -f android/app/build.gradle ]]; then
            flutter create \
              --platforms=android \
              --org com.vpnsopr \
              --project-name vpnsopr \
              --no-pub .
          fi

      - name: Configure Android project
        run: python3 scripts/patch_android.py

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          android = Path("android")
          files = list(android.rglob("build.gradle")) + list(android.rglob("build.gradle.kts"))
          changed = False

          for path in files:
              source = path.read_text(encoding="utf-8")
              updated = source

              updated, n1 = re.subn(
                  r"(?m)^(\s*compileSdk\s*=\s*)\d+.*$",
                  r"\g<1>36",
                  updated,
              )

              updated, n2 = re.subn(
                  r"(?m)^(\s*compileSdk\s*=\s*)flutter\.compileSdkVersion\s*$",
                  r"\g<1>36",
                  updated,
              )

              updated, n3 = re.subn(
                  r"(?m)^(\s*compileSdkVersion\s*(?:=\s*)?)\d+.*$",
                  r"\g<1>36",
                  updated,
              )

              if n1 + n2 + n3:
                  path.write_text(updated, encoding="utf-8")
                  changed = True

          if not changed:
              raise SystemExit(
                  "Could not find a compileSdk setting in Android Gradle files."
              )

          print("Android compile SDK set to 36.")
          PY

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
          
