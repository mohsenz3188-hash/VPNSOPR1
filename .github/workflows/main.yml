
name: Build VPNSOPR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VPNSOPR Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/VPNSOPR-Android-Source.zip"

          test -f "$ZIP"

          mkdir -p "$RUNNER_TEMP/vpnsopr"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/vpnsopr"

          PROJECT=""

          while IFS= read -r f; do
            D="$(dirname "$f")"
            if [ -f "$D/lib/main.dart" ]; then
              PROJECT="$D"
              break
            fi
          done < <(find "$RUNNER_TEMP/vpnsopr" -name pubspec.yaml)

          if [ -z "$PROJECT" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Prepare Android Project
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.vpnsopr \
              --project-name vpnsopr \
              --no-pub .
          fi

      - name: Configure Dependencies
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          pub = Path("pubspec.yaml")
          s = pub.read_text(encoding="utf-8")

          s, n = re.subn(
              r'(?m)^(\s*file_picker:\s*).+$',
              r'\g<1>^13.3.0',
              s,
              count=1
          )

          if n != 1:
              raise SystemExit("file_picker not found")

          pub.write_text(s, encoding="utf-8")

          for p in Path("lib").rglob("*.dart"):
              s = p.read_text(encoding="utf-8")

              s = s.replace(
                  "FilePicker.platform.pickFiles(",
                  "FilePicker.pickFiles("
              )

              s = s.replace(
                  "FilePicker.platform.saveFile(",
                  "FilePicker.saveFile("
              )

              s = re.sub(
                  r'(?m)^[ \t]*withData:\s*true,\s*\n',
                  '',
                  s
              )

              s = s.replace(
                  "if (result == null || result.files.isEmpty) return;",
                  "if (result.isEmpty) return;"
              )

              s = s.replace(
                  "final file = result.files.first;",
                  "final file = result.first;"
              )

              s = s.replace(
                  "final bytes = file.bytes ?? (file.path != null ? await File(file.path!).readAsBytes() : null);",
                  "final bytes = await file.readAsBytes();"
              )

              s = s.replace(
                  "        type: FileType.custom,\n        allowedExtensions: ['json'],\n        bytes:",
                  "        bytes:"
              )

              if not re.search(r'\bFile\s*\(', s):
                  s = re.sub(
                      r"(?m)^import 'dart:io';\s*\n",
                      "",
                      s
                  )

              p.write_text(s, encoding="utf-8")

          # Android configuration
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              p = kts
              s = p.read_text(encoding="utf-8")

              for key, value in [
                  ("compileSdk", "37"),
                  ("minSdk", "26")
              ]:
                  pattern = rf'(?m)^(\s*{key}\s*=\s*).+$'
                  s, n = re.subn(
                      pattern,
                      lambda m: m.group(1) + value,
                      s,
                      count=1
                  )
                  if n != 1:
                      raise SystemExit(f"Cannot configure {key}")

              s = re.sub(
                  r'(?m)^(\s*sourceCompatibility\s*=\s*)JavaVersion\.\w+.*$',
                  r'\g<1>JavaVersion.VERSION_17',
                  s
              )

              s = re.sub(
                  r'(?m)^(\s*targetCompatibility\s*=\s*)JavaVersion\.\w+.*$',
                  r'\g<1>JavaVersion.VERSION_17',
                  s
              )

              if "isCoreLibraryDesugaringEnabled" not in s:
                  s, n = re.subn(
                      r'(compileOptions\s*\{)',
                      r'\1\n        isCoreLibraryDesugaringEnabled = true',
                      s,
                      count=1
                  )
                  if n != 1:
                      raise SystemExit("Cannot enable desugaring")

              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'

              if "desugar_jdk_libs" not in s:
                  s = re.sub(
                      r'(?m)^(\s*dependencies\s*\{)',
                      lambda m: m.group(1) + '\n    ' + dep,
                      s,
                      count=1
                  )

          elif groovy.exists():
              p = groovy
              s = p.read_text(encoding="utf-8")

              for key, value in [
                  ("compileSdkVersion", "37"),
                  ("minSdkVersion", "26")
              ]:
                  pattern = rf'(?m)^(\s*{key}\s+).+$'
                  s, n = re.subn(
                      pattern,
                      lambda m: m.group(1) + value,
                      s,
                      count=1
                  )
                  if n != 1:
                      raise SystemExit(f"Cannot configure {key}")

              if "coreLibraryDesugaringEnabled" not in s:
                  s = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        coreLibraryDesugaringEnabled true',
                      s,
                      count=1
                  )

              if "desugar_jdk_libs" not in s:
                  dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
                  s = re.sub(
                      r'(?m)^(\s*dependencies\s*\{)',
                      lambda m: m.group(1) + '\n    ' + dep,
                      s,
                      count=1
                  )

          else:
              raise SystemExit("Android Gradle file not found")

          p.write_text(s, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              m = manifest.read_text(encoding="utf-8")

              m = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="TUN VPNSOPR"',
                  m,
                  count=1
              )

              if "android.permission.CAMERA" not in m:
                  match = re.search(r"<manifest\b[^>]*>", m)
                  if match:
                      m = (
                          m[:match.end()]
                          + '\n    <uses-permission android:name="android.permission.CAMERA" />'
                          + m[match.end():]
                      )

              manifest.write_text(m, encoding="utf-8")

          print("Dependencies configured")
          print("Android SDK 37 configured")
          print("Java 17 configured")
          PY

      - name: Clean and Resolve
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get

      - name: Download Official SingBox AAR
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="$(python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          config = json.loads(
              Path(".dart_tool/package_config.json").read_text()
          )

          package = next(
              p for p in config["packages"]
              if p["name"] == "flutter_sing_box"
          )

          uri = urlparse(package["rootUri"])

          if uri.scheme != "file":
              raise SystemExit("Invalid plugin package URI")

          print(unquote(uri.path))
          PY
          )"

          GRADLE="$PLUGIN_DIR/android/build.gradle.kts"
          LIBDIR="$PLUGIN_DIR/android/libs"
          AAR="$LIBDIR/libbox.aar"

          if [ ! -f "$GRADLE" ]; then
            echo "Plugin Gradle file not found"
            exit 1
          fi

          mkdir -p "$LIBDIR"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 30 \
            "https://github.com/singbox-android/libbox/releases/download/1.14.3/libbox.aar" \
            -o "$AAR"

          test -s "$AAR"

          unzip -tq "$AAR"

          echo "Official libbox AAR downloaded successfully"

          python3 - "$GRADLE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          old = 'implementation("com.github.singbox-android:libbox:1.14.3")'
          new = 'implementation(files("libs/libbox.aar"))'

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Expected libbox dependency not found")

          p.write_text(s, encoding="utf-8")

          print("Gradle now uses the local libbox AAR")
          PY

      - name: Verify Native Dependency
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 -type d \
            -name 'flutter_sing_box-*' | head -n 1)"

          test -n "$PLUGIN_DIR"
          test -s "$PLUGIN_DIR/android/libs/libbox.aar"

          grep -n 'libbox.aar' \
            "$PLUGIN_DIR/android/build.gradle.kts"

          echo "Native dependency verification passed"

      - name: Build Release APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-APKs
          path: ${{ steps.source.outputs.project }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
